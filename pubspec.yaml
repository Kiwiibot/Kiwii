name: kiwii
description: A Discord bot written with nyxx and nyxx_commands.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  nyxx_commands: any
    # path: ../../../code/nyxx_commands
  postgres: 3.4.1
  get_it: ^8.0.3
  dartx: ^1.2.0
  uwurandom: ^1.1.0
  slang: ^4.4.1
  path: ^1.8.3
  http: ^1.1.0
  nyxx_extensions: ^4.2.0
  dart_openai: ^5.1.0
  darq: ^2.0.0
  stdlibc: ^0.1.4
  sentry: ^8.3.0
  nyxx: ^6.4.3
  overfast_api:
    git:
      url: https://git.lexedia.moe/Lexedia/overfast_api.git
  perspective_api:
    git:
      url: https://git.lexedia.moe/Lexedia/perspective_api.git
  option:
    git:
      url: https://git.sr.ht/~lexie/option

  dotenv: any
  duration: ^4.0.3
  sqlite3: ^2.4.2
  string_similarity: ^2.0.0
  style_cron_job: ^1.0.4+2
  neat_cache: ^2.0.4
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_helmet: ^2.3.0
  diff_match_patch: ^0.4.1
  openai_dart: ^0.4.5
  archive: ^4.0.2
  nyxx_utils:
    path: ../nyxx_utils
  args: ^2.6.0
dependency_overrides:
  nyxx:
    git:
      url: https://github.com/Lexedia/nyxx.git
      ref: feat/priv-utils
  nyxx_commands:
    # git:
    #   url: https://github.com/Lexedia/nyxx_commands.git
    #   ref: dev
    path: ../nyxx_commands
  analyzer: ^6.4.1

dev_dependencies:
  build_runner: ^2.4.9
  lints: ^5.1.1
  shelf_router_generator: ^1.1.0
  custom_lint: ^0.7.0
  mio:
    git:
      url: https://github.com/Lexedia/mio_lints.git
