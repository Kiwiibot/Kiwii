info:
  description: Obtenez des informations sur un utilisateur ou le serveur.
  usage: "[sous-commande]"
  examples:
    usages: []
    descriptions: []
  user:
    description: Obtenez des informations sur un utilisateur, ou sur vous si aucun utilisateur n'a été fourni.
    usage: "<utilisateur>"
    examples:
      usages:
        - "@utilisateur"
        - ""
      descriptions:
        - Obtenez des informations sur l'utilisateur @utilisateur.
        - Obtenez des informations sur vous.
    member: Membre
    name: Nom
    nick: Surnom
    joined_at: A rejoint le
    created_at: Créé le
    status: Statut
    roles:
      one: Rôle [$n]
      other: Rôles [$n]
    id: 'ID: $id'
    seen_in: Vu dans
    servers:
      one: $n serveur.
      other: $n serveurs.
    past_usernames: Anciens noms d'utilisateur
    past_global_names: Anciens noms d'affichage
    past_nicknames: Anciens surnoms

avatar:
  description: >-
    Obtenez l'avatar de l'utilisateur, ou le vôtre si non spécifié, vous pouvez également inclure une taille facultative.
    La taille sera limitée à la puissance de deux la plus proche disponible ; en cas d'égalité, la plus petite est choisie.
  usage: "<utilisateur> <taille:16..4096> <serveur>"
  examples:
    usages:
      - "@lexedia"
      - "@utilisateur 2048"
      - "@utilisateur 557"
    descriptions:
      - "Obtenez l'avatar de @lexedia"
      - "Obtenez l'avatar d'@utilisateur, avec une taille de 2048"
      - "Obtenez l'avatar du serveur d'@utilisateur, avec une taille de 512"
  avatar_of: Avatar de $user
  display_error: Si l'image ne s'affiche pas, [cliquez ici]($url)
